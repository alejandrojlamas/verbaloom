name: Build macOS Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            artifact_suffix: Intel
          - os: macos-14
            arch: arm64
            artifact_suffix: AppleSilicon

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        pyinstaller --clean build/macos/VerbaLoom-macOS.spec

    - name: Get executable info
      id: exe_info
      run: |
        SIZE_BYTES=$(stat -f%z dist/VerbaLoom)
        SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
        echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
        echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
        ARCH=$(file dist/VerbaLoom | grep -o 'arm64\|x86_64')
        echo "arch=$ARCH" >> $GITHUB_OUTPUT

    - name: Create release archive
      run: |
        # Create a release folder with the executable and readme
        mkdir -p release

        # Copy executable
        cp dist/VerbaLoom release/

        # Make sure it's executable
        chmod +x release/VerbaLoom

        # Create a README for the release
        cat > release/README.txt << 'EOF'
        # VerbaLoom macOS Executable

        ## Quick Start

        1. Extract VerbaLoom to a folder of your choice
        2. Open Terminal and run: ./VerbaLoom
        3. Open your browser to http://localhost:5000
        4. Choose your LLM provider (see below)

        ## First Launch - Security Authorization

        macOS will block the app on first launch. To authorize it:

        1. Double-click VerbaLoom - macOS will show a warning
        2. Open System Settings > Privacy & Security
        3. Scroll down and click "Open Anyway" next to the VerbaLoom message
        4. Click "Open" in the confirmation dialog

        This only needs to be done once.

        ## LLM Providers

        You need at least one LLM provider to translate:

        - DeepSeek - Chinese AI lab: https://platform.deepseek.com/api_keys
        - Gemini - Google AI: https://aistudio.google.com/apikey
        - Mistral - French AI lab: https://console.mistral.ai/api-keys
        - Ollama (Local) - Free, runs on your machine: https://ollama.com
        - OpenAI - GPT models: https://platform.openai.com/api-keys
        - OpenRouter - 200+ cloud models: https://openrouter.ai/keys
        - Poe - Multi-model cloud aggregator: https://poe.com/api_key

        For local translation with Ollama:
        1. Install Ollama from https://ollama.com
        2. Download a model: ollama pull qwen3:14b

        ## Choosing the Best Model for Your Language

        Different models perform better for different target languages!

        See our comprehensive benchmarks to find the best model:
        https://github.com/alejandrojlamas/verbaloom/wiki

        ## First Run

        On first run, the application will:
        - Create a VerbaLoom_Data folder next to the executable
        - Generate a default .env configuration file
        - Create necessary subdirectories (translated_files, checkpoints)

        ## Configuration

        Edit VerbaLoom_Data/.env to customize:
        - LLM provider and model selection
        - API keys for cloud providers
        - Server port and host

        ## Usage

        - Web UI: http://localhost:5000
        - Supported formats: .txt, .epub, .srt, .docx, .odt
        - Output files: VerbaLoom_Data/translated_files/

        ## Links

        - Full Documentation: https://github.com/alejandrojlamas/verbaloom
        - Model Benchmarks: https://github.com/alejandrojlamas/verbaloom/wiki
        - Report Issues: https://github.com/alejandrojlamas/verbaloom/issues
        - OpenRouter Models: https://openrouter.ai/models
        EOF

        # Create zip archive
        cd release
        zip -r ../VerbaLoom-macOS-${{ matrix.artifact_suffix }}.zip .
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VerbaLoom-macOS-${{ matrix.artifact_suffix }}
        path: VerbaLoom-macOS-${{ matrix.artifact_suffix }}.zip
        retention-days: 90

    - name: Upload executable only
      uses: actions/upload-artifact@v4
      with:
        name: VerbaLoom-${{ matrix.artifact_suffix }}
        path: dist/VerbaLoom
        retention-days: 90

    - name: Build summary
      run: |
        echo "### Build Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platform:** macOS ${{ matrix.artifact_suffix }} (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
        echo "**Executable Size:** ${{ steps.exe_info.outputs.size_mb }} MB" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
        echo "- VerbaLoom-macOS-${{ matrix.artifact_suffix }}.zip (executable + README)" >> $GITHUB_STEP_SUMMARY
        echo "- VerbaLoom (standalone)" >> $GITHUB_STEP_SUMMARY

  create-release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: VerbaLoom-macOS-*
        merge-multiple: false

    - name: List downloaded files
      run: |
        ls -la
        find . -name "*.zip" -type f

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          VerbaLoom-macOS-Intel/VerbaLoom-macOS-Intel.zip
          VerbaLoom-macOS-AppleSilicon/VerbaLoom-macOS-AppleSilicon.zip
        body: |
          ## macOS Executable Release

          ### Downloads
          - **VerbaLoom-macOS-AppleSilicon.zip** - For Apple Silicon Macs (M1/M2/M3/M4)
          - **VerbaLoom-macOS-Intel.zip** - For Intel-based Macs

          ### Installation
          1. Download the appropriate version for your Mac
          2. Extract the zip file
          3. Install [Ollama](https://ollama.ai) (required for local LLM)
          4. Open Terminal and run `./VerbaLoom`
          5. Open http://localhost:5000 in your browser

          ### First Launch - Security Authorization
          macOS will block the app on first launch:
          1. Double-click VerbaLoom - macOS shows a warning
          2. Open **System Settings > Privacy & Security**
          3. Click **"Open Anyway"** next to the VerbaLoom message

          This only needs to be done once.

          ### What's Included
          - Single-file macOS executable (no Python installation required)
          - Auto-generated configuration on first run
          - Support for .txt, .epub, .srt translation

          ### System Requirements
          - macOS 11+ (Big Sur or later)
          - Ollama installed for local LLM support
          - Or API keys for cloud providers (OpenAI, Gemini, OpenRouter)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
